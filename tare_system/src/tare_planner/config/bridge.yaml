  # DCL-SLAM cross-robot transport.  High-bandwidth local LiDAR, IMU,
  # registered clouds, terrain maps and velocity commands are intentionally
  # not bridged.
  -
    topic: /a/distributedMapping/globalDescriptors
    type: dcl_slam_msgs/msg/GlobalDescriptor
    queue_size: 10
    transient_local: true
  -
    topic: /b/distributedMapping/globalDescriptors
    type: dcl_slam_msgs/msg/GlobalDescriptor
    queue_size: 10
    transient_local: true
  -
    topic: /a/distributedMapping/loopInfo
    type: dcl_slam_msgs/msg/LoopInfo
    queue_size: 10
  -
    topic: /b/distributedMapping/loopInfo
    type: dcl_slam_msgs/msg/LoopInfo
    queue_size: 10
  -
    topic: /a/distributedMapping/optimizationState
    type: std_msgs/msg/Int8
    queue_size: 50
  -
    topic: /b/distributedMapping/optimizationState
    type: std_msgs/msg/Int8
    queue_size: 50
  -
    topic: /a/distributedMapping/rotationEstimateState
    type: std_msgs/msg/Int8
    queue_size: 50
  -
    topic: /b/distributedMapping/rotationEstimateState
    type: std_msgs/msg/Int8
    queue_size: 50
  -
    topic: /a/distributedMapping/poseEstimateState
    type: std_msgs/msg/Int8
    queue_size: 50
  -
    topic: /b/distributedMapping/poseEstimateState
    type: std_msgs/msg/Int8
    queue_size: 50
  -
    topic: /a/distributedMapping/neighborRotationEstimates
    type: dcl_slam_msgs/msg/NeighborEstimate
    queue_size: 50
  -
    topic: /b/distributedMapping/neighborRotationEstimates
    type: dcl_slam_msgs/msg/NeighborEstimate
    queue_size: 50
  -
    topic: /a/distributedMapping/neighborPoseEstimates
    type: dcl_slam_msgs/msg/NeighborEstimate
    queue_size: 50
  -
    topic: /b/distributedMapping/neighborPoseEstimates
    type: dcl_slam_msgs/msg/NeighborEstimate
    queue_size: 50

  # Readiness is used locally to prevent either planner from moving before
  # both DCL global frames have become available.
  -
    topic: /a/dcl_slam/alignment_ready
    type: std_msgs/msg/Bool
    queue_size: 1
    transient_local: true
  -
    topic: /b/dcl_slam/alignment_ready
    type: std_msgs/msg/Bool
    queue_size: 1
    transient_local: true
